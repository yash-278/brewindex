<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BrewIndex — Sketch 001: Browse Grid</title>
<link rel="stylesheet" href="../themes/default.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    background: var(--color-bg);
    color: var(--color-text);
    font-family: var(--font-sans);
    font-size: var(--text-base);
    line-height: 1.5;
    padding-top: 44px; /* variant nav */
  }

  /* ── Variant nav (top bar) ─────────────────────────────── */
  #variant-nav {
    position: fixed; top: 0; left: 0; right: 0; z-index: 9998;
    background: #111111;
    border-bottom: 1px solid var(--color-border);
    padding: 0 16px;
    display: flex; align-items: center; gap: 4px;
    height: 44px;
    font-family: var(--font-sans);
    font-size: 12px;
  }

  .vn-label {
    color: var(--color-text-faint);
    font-size: 11px;
    margin-right: 8px;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    white-space: nowrap;
  }

  .variant-tab {
    background: transparent;
    border: 1px solid transparent;
    border-radius: var(--radius-sm);
    color: var(--color-text-muted);
    cursor: pointer;
    font-size: 12px;
    font-family: var(--font-sans);
    padding: 5px 12px;
    transition: all 0.15s ease;
    white-space: nowrap;
  }
  .variant-tab:hover { color: var(--color-text); background: var(--color-surface); }
  .variant-tab.active {
    background: var(--color-primary-dim);
    border-color: rgba(124,106,255,0.35);
    color: var(--color-primary-hover);
  }

  .vn-spacer { flex: 1; }

  /* ── Shared app shell ─────────────────────────────────── */
  .shell-header {
    height: 56px;
    border-bottom: 1px solid var(--color-border);
    display: flex; align-items: center;
    padding: 0 24px;
    gap: 16px;
    background: var(--color-bg);
    position: sticky; top: 44px; z-index: 100;
  }

  .logo {
    font-size: 16px; font-weight: 700;
    color: var(--color-text);
    letter-spacing: -0.02em;
    display: flex; align-items: center; gap: 8px;
  }
  .logo-icon {
    width: 24px; height: 24px; border-radius: 6px;
    background: linear-gradient(135deg, var(--color-primary), #c084fc);
    display: flex; align-items: center; justify-content: center;
    font-size: 13px;
  }

  .search-bar {
    flex: 1; max-width: 480px;
    display: flex; align-items: center; gap: 8px;
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 7px 12px;
    cursor: not-allowed;
    opacity: 0.55;
  }
  .search-icon { color: var(--color-text-faint); font-size: 13px; }
  .search-hint { color: var(--color-text-faint); font-size: var(--text-sm); }

  .header-count {
    color: var(--color-text-muted);
    font-size: var(--text-sm);
    margin-left: auto;
  }

  /* ── Page layout ──────────────────────────────────────── */
  .page-wrap {
    max-width: 1280px;
    margin: 0 auto;
    padding: var(--space-6) var(--space-6);
  }

  .section-heading {
    font-size: var(--text-sm);
    color: var(--color-text-faint);
    text-transform: uppercase;
    letter-spacing: 0.07em;
    margin-bottom: var(--space-4);
    font-weight: 500;
  }

  /* ── Pagination ───────────────────────────────────────── */
  .pagination {
    display: flex; align-items: center; justify-content: center;
    gap: var(--space-2); padding: var(--space-8) 0 var(--space-4);
  }
  .page-btn {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-sm);
    color: var(--color-text-muted);
    cursor: pointer;
    font-size: var(--text-sm);
    font-family: var(--font-sans);
    padding: 6px 12px;
    transition: all 0.15s ease;
  }
  .page-btn:hover { border-color: var(--color-primary); color: var(--color-text); }
  .page-btn.active {
    background: var(--color-primary-dim);
    border-color: rgba(124,106,255,0.4);
    color: var(--color-primary-hover);
  }
  .page-sep { color: var(--color-text-faint); font-size: var(--text-sm); padding: 0 4px; }

  /* ═══════════════════════════════════════════════════════
     VARIANT A — Icon-Hero Cards (App Store style)
     Large icon, name below, description underneath
  ═══════════════════════════════════════════════════════ */

  #variant-a .browse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(172px, 1fr));
    gap: var(--space-4);
  }

  #variant-a .cask-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; flex-direction: column; gap: var(--space-3);
  }
  #variant-a .cask-card:hover {
    border-color: rgba(124,106,255,0.4);
    background: var(--color-surface-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-glow);
  }

  #variant-a .card-icon {
    width: 56px; height: 56px;
    border-radius: var(--radius-md);
    overflow: hidden; flex-shrink: 0;
  }
  #variant-a .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  #variant-a .card-icon.fallback {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 20px; color: white;
    letter-spacing: -0.02em;
  }

  #variant-a .card-name {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #variant-a .card-desc {
    font-size: var(--text-xs);
    color: var(--color-text-muted);
    line-height: 1.45;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  /* ═══════════════════════════════════════════════════════
     VARIANT B — Horizontal List-Card (Raycast style)
     Icon left, name + description right, full-width row
  ═══════════════════════════════════════════════════════ */

  #variant-b .browse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: var(--space-2);
  }

  #variant-b .cask-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border-subtle);
    border-radius: var(--radius-md);
    padding: 12px 14px;
    cursor: pointer;
    transition: all 0.12s ease;
    display: flex; align-items: center; gap: 12px;
  }
  #variant-b .cask-card:hover {
    background: var(--color-surface-hover);
    border-color: rgba(124,106,255,0.3);
  }

  #variant-b .card-icon {
    width: 40px; height: 40px; flex-shrink: 0;
    border-radius: var(--radius-sm);
    overflow: hidden;
  }
  #variant-b .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  #variant-b .card-icon.fallback {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 15px; color: white;
  }

  #variant-b .card-body { flex: 1; min-width: 0; }
  #variant-b .card-name {
    font-size: var(--text-sm);
    font-weight: 600;
    color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #variant-b .card-desc {
    font-size: var(--text-xs);
    color: var(--color-text-muted);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-top: 1px;
  }
  #variant-b .card-token {
    font-size: var(--text-xs);
    color: var(--color-text-faint);
    font-family: var(--font-mono);
    font-size: 10px;
    flex-shrink: 0;
  }

  /* ═══════════════════════════════════════════════════════
     VARIANT C — Compact Tile (icon + name, no description)
     More apps per screen, description tooltip on hover
  ═══════════════════════════════════════════════════════ */

  #variant-c .browse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
    gap: var(--space-3);
  }

  #variant-c .cask-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-4) var(--space-3);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
    text-align: center;
    position: relative;
  }
  #variant-c .cask-card:hover {
    border-color: rgba(124,106,255,0.4);
    background: var(--color-surface-hover);
    transform: translateY(-1px);
    box-shadow: var(--shadow-glow);
  }
  #variant-c .cask-card:hover .card-tooltip {
    opacity: 1; visibility: visible; transform: translateY(0);
  }

  #variant-c .card-icon {
    width: 48px; height: 48px;
    border-radius: var(--radius-md);
    overflow: hidden;
  }
  #variant-c .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  #variant-c .card-icon.fallback {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: white;
  }

  #variant-c .card-name {
    font-size: var(--text-xs);
    font-weight: 600;
    color: var(--color-text);
    width: 100%;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    line-height: 1.3;
  }

  #variant-c .card-tooltip {
    position: absolute; bottom: calc(100% + 8px); left: 50%;
    transform: translateX(-50%) translateY(4px);
    background: #2e2e2e;
    border: 1px solid var(--color-border);
    border-radius: var(--radius-md);
    padding: 8px 10px;
    font-size: var(--text-xs);
    color: var(--color-text-muted);
    width: 200px; text-align: left;
    opacity: 0; visibility: hidden;
    transition: opacity 0.15s ease, transform 0.15s ease;
    pointer-events: none;
    box-shadow: var(--shadow-md);
    z-index: 10;
    line-height: 1.4;
  }
  #variant-c .card-tooltip::after {
    content: '';
    position: absolute; top: 100%; left: 50%;
    transform: translateX(-50%);
    border: 5px solid transparent;
    border-top-color: #2e2e2e;
  }

  /* ═══════════════════════════════════════════════════════
     VARIANT D — Tall Horizontal Cards
     Larger icon, 2-line description always visible,
     metadata strip at bottom for install count + version
  ═══════════════════════════════════════════════════════ */

  #variant-d .browse-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(460px, 1fr));
    gap: var(--space-3);
  }

  #variant-d .cask-card {
    background: var(--color-surface);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-lg);
    padding: var(--space-5);
    cursor: pointer;
    transition: all 0.15s ease;
    display: flex; align-items: flex-start; gap: var(--space-4);
  }
  #variant-d .cask-card:hover {
    border-color: rgba(124,106,255,0.4);
    background: var(--color-surface-hover);
    box-shadow: var(--shadow-glow);
  }

  #variant-d .card-icon {
    width: 52px; height: 52px; flex-shrink: 0;
    border-radius: var(--radius-md);
    overflow: hidden;
    margin-top: 2px;
  }
  #variant-d .card-icon img { width: 100%; height: 100%; object-fit: cover; }
  #variant-d .card-icon.fallback {
    display: flex; align-items: center; justify-content: center;
    font-weight: 700; font-size: 18px; color: white;
  }

  #variant-d .card-body {
    flex: 1; min-width: 0;
    display: flex; flex-direction: column; gap: var(--space-2);
  }

  #variant-d .card-header {
    display: flex; align-items: baseline; gap: var(--space-2);
  }
  #variant-d .card-name {
    font-size: var(--text-base);
    font-weight: 600;
    color: var(--color-text);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #variant-d .card-version {
    font-size: var(--text-xs);
    color: var(--color-text-faint);
    font-family: var(--font-mono);
    flex-shrink: 0;
  }

  #variant-d .card-desc {
    font-size: var(--text-sm);
    color: var(--color-text-muted);
    line-height: 1.5;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  #variant-d .card-meta {
    display: flex; align-items: center; gap: var(--space-3);
    margin-top: var(--space-1);
  }
  #variant-d .meta-pill {
    display: flex; align-items: center; gap: 4px;
    background: var(--color-bg);
    border: 1px solid var(--color-border);
    border-radius: var(--radius-full);
    padding: 2px 8px;
    font-size: var(--text-xs);
    color: var(--color-text-muted);
  }
  #variant-d .meta-pill.installs {
    border-color: rgba(124,106,255,0.25);
    color: var(--color-primary-hover);
    background: var(--color-primary-dim);
  }
  #variant-d .meta-dot {
    color: var(--color-text-faint);
    font-size: 10px;
  }
  #variant-d .card-token {
    font-family: var(--font-mono);
    font-size: 10px;
    color: var(--color-text-faint);
    margin-left: auto;
  }
</style>
</head>

function hashColor(str) {
  const colors = ['#7C6AFF','#FF6B6B','#4ADE80','#FB923C','#22D3EE','#F472B6','#A78BFA','#34D399','#FBBF24','#60A5FA'];
  let h = 0;
  for (let i = 0; i < str.length; i++) h = (h * 31 + str.charCodeAt(i)) & 0xfffffff;
  return colors[h % colors.length];
}

function initials(name) {
  const parts = name.replace(/[^a-zA-Z0-9 ]/g, '').split(' ').filter(Boolean);
  if (parts.length === 1) return parts[0].slice(0, 2).toUpperCase();
  return (parts[0][0] + parts[1][0]).toUpperCase();
}

function iconHtml(cask, size) {
  // Use DuckDuckGo favicon fallback; in sketch we render initials avatar directly to avoid CORS
  const bg = cask.color || hashColor(cask.token);
  return `<div class="card-icon fallback" style="background:${bg};width:${size}px;height:${size}px;">${cask.initials || initials(cask.name)}</div>`;
}

      <div class="card-name">${c.name}</div>
      <div class="card-desc">${c.desc}</div>

}

function fmtInstalls(n) {
  if (n >= 1000000) return (n / 1000000).toFixed(1) + 'M';
  if (n >= 1000) return (n / 1000).toFixed(0) + 'K';
  return n.toString();
}

// ── Variant switching ──────────────────────────────────
function showVariant(id, btn) {
  document.querySelectorAll('.variant').forEach(v => v.style.display = 'none');
  document.querySelectorAll('.variant-tab').forEach(t => t.classList.remove('active'));
  document.getElementById('variant-' + id).style.display = 'block';
  (btn || document.querySelector(`[onclick*="'${id}'"]`)).classList.add('active');
}

// ── Click feedback ─────────────────────────────────────
function openCask(token) {
  const tip = document.createElement('div');
  tip.textContent = `→ /cask/${token}`;
  tip.style.cssText = `position:fixed;bottom:56px;left:50%;transform:translateX(-50%);background:#1a1a1a;border:1px solid rgba(124,106,255,0.4);color:#9581ff;font-family:monospace;font-size:12px;padding:6px 14px;border-radius:6px;z-index:9997;pointer-events:none;transition:opacity 0.3s;`;
  document.body.appendChild(tip);
  setTimeout(() => { tip.style.opacity = '0'; setTimeout(() => tip.remove(), 300); }, 1500);
}

// ── Viewport control ───────────────────────────────────
function setWidth(w) {
  document.querySelectorAll('.page-wrap').forEach(el => {
    el.style.maxWidth = w ? w + 'px' : '1280px';
    el.style.padding = w && w <= 375 ? '16px' : '24px';
  });
}

// ── Page button interactivity ──────────────────────────
document.addEventListener('click', e => {
  if (e.target.classList.contains('page-btn') && !e.target.textContent.includes('←') && !e.target.textContent.includes('→')) {
    e.target.closest('.pagination').querySelectorAll('.page-btn').forEach(b => b.classList.remove('active'));
    e.target.classList.add('active');
  }
});

// ── Init ──────────────────────────────────────────────
renderA(); renderB(); renderC(); renderD();
</script>
